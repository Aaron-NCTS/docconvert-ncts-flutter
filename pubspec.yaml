name: docconvert_ncts
description: "DocConvert NCTS - Convierte y administra tus documentos."
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6

  # Gestión de estado: Provider es el más simple que cubre lo que
  # necesitamos (documento seleccionado, progreso, historial) sin
  # introducir una arquitectura más compleja de la necesaria.
  provider: ^6.1.2

  # Selección de archivos (PDF/DOCX/imágenes) desde cualquier proveedor
  # de Android (Descargas, Drive, Fotos, etc.). Nota real (confirmada en
  # el changelog oficial en GitHub): la versión 8.x tenía el AAR
  # compilado contra un SDK de Android viejo (arreglado en la 10.3.3,
  # que actualiza a flutter.compileSdkVersion). La rama 11.x+ trae ese
  # arreglo, pero migró su registro de plugin a un esquema de Kotlin más
  # nuevo (pensado para AGP 9+) que rompe la compilación en un proyecto
  # Flutter estándar como este (confirmado en los logs de GitHub Actions:
  # "cannot find symbol class FilePickerPlugin"). La 10.x trae el primer
  # arreglo sin el segundo problema -- por eso NO se necesita ningún
  # dependency_overrides.
  file_picker: ^10.3.3

  # Rutas de almacenamiento propio de la app (documentos, temporales).
  path_provider: ^2.1.4
  path: ^1.9.0

  # Generación de PDF (Fotos -> PDF, Word -> PDF) en Dart puro.
  pdf: ^3.11.1

  # Procesar fotos (reducir resolución/calidad según lo que elija el
  # usuario) antes de incrustarlas en el PDF -- sin esto, el selector de
  # "Calidad" en Fotos a PDF no hacía nada real.
  image: ^4.2.0

  # Leer el contenido de un .docx (que es un ZIP con XML adentro) sin
  # depender de ninguna librería de terceros para el formato -- mismo
  # enfoque que ya usamos en Python con docx_lite.py.
  archive: ^3.6.1
  xml: ^6.5.0

  # Extraer texto de PDF para PDF -> Word. Es la única pieza de este
  # proyecto que usa una librería de un tercero (no hay una opción pura-
  # Dart igual de robusta) -- decisión ya conversada y aceptada contigo.
  syncfusion_flutter_pdf: ^27.1.58

  # IDs únicos para cada documento generado (evita el bug de "índices
  # inseguros" al eliminar/reordenar que mencionaste en la especificación).
  uuid: ^4.5.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

  # Genera los íconos de Android en todas las resoluciones a partir de
  # una sola imagen fuente (ver flutter_launcher_icons: abajo).
  flutter_launcher_icons: ^0.14.1

flutter:
  uses-material-design: true
  assets:
    - assets/icon/app_icon.png

flutter_launcher_icons:
  android: true
  image_path: "assets/icon/app_icon.png"
  min_sdk_android: 21
